[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
description = "Relay — a zero-friction AI gateway platform."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "httpx==0.28.1",
    "python-dotenv==1.1.1",
    "pydantic==2.11.7",
    "rich==15.0.0",
]

[project.scripts]
relay = "app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]
